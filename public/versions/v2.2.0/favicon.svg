<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Opale">
  <title>Opale</title>
  <!-- Deux jetons de la charte, écrits en dur faute de pouvoir citer une
       variable CSS depuis une ressource que le navigateur charge hors du
       document. Les valeurs, leurs ratios mesurés et la raison du dessin sont
       dans le commentaire du lien qui charge ce fichier (index.html).
       NE PAS citer ici le nom d'un jeton : deux tirets consécutifs sont
       illégaux dans un commentaire XML, le SVG cesse alors d'être analysable,
       et le navigateur n'affiche aucune erreur. C'est arrivé une fois. -->
  <rect width="32" height="32" rx="7" fill="#087487" />
  <path d="M16 5.5c5.1 4.6 8.2 8.3 8.2 12.1a8.2 8.2 0 0 1-16.4 0c0-3.8 3.1-7.5 8.2-12.1Z" fill="#deedf0" />
</svg>
